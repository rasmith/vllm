  - tests/v1/core
  - tests/v1/executor
  - tests/v1/kv_offload
  - tests/v1/simple_kv_offload
  - tests/v1/worker
  - tests/v1/streaming_input
  - tests/v1/kv_connector/unit
  - tests/v1/ec_connector/unit
  - tests/v1/metrics
  - tests/entrypoints/openai/correctness/test_lmeval.py
  - vllm/config/
  - vllm/distributed/
  - vllm/engine/
  - vllm/entrypoints/pooling/
  - vllm/inputs/
  - vllm/lora/
  - vllm/model_executor/
  - vllm/multimodal/
  - vllm/outputs.py
  - vllm/platforms/
  - vllm/pooling_params.py
  - vllm/profiler/
  - vllm/sampling_params.py
  - vllm/tokenizers/
  - vllm/transformers_utils/
  - vllm/utils/
