# In this file, you can add more tests to run either by adding a new step or
# adding a new command to an existing step. See different options here for examples.

# This script will be feed into Jinja template in `test-template-amd.j2` at
# https://github.com/vllm-project/buildkite-ci/blob/main/scripts/test-template-amd.j2
# to generate the final pipeline yaml file.

# Documentation
# label(str): the name of the test. emojis allowed.
# fast_check(bool): whether to run this on each commit on the fastcheck pipeline.
# fast_check_only(bool): run this test on the fastcheck pipeline only
# optional(bool): never run this test by default (i.e. need to unblock manually) unless it's a scheduled nightly run.
# soft_fail(bool): allow this step to fail without failing the entire pipeline (useful for flaky or experimental tests).
# command(str): the single command to run for tests. incompatible with commands.
# commands(list): the list of commands to run for the test. incompatible with command.
# mirror_hardwares(list): selector tags for AMD pipelines that should include the test.
# dind(bool): when false, run the job directly in the AMD Kubernetes pod.
#     When true or omitted, use the legacy Docker-in-Docker path.
# num_gpus(int): override the number of GPUs for the test. defaults to 1 GPU. currently supports 2,4.
# num_nodes(int): whether to simulate multi-node setup by launching multiple containers on one host,
#     in this case, commands must be specified. the first command runs on the first host, the second
#     command runs on the second host.
# timeout_in_minutes(int): sets a timeout for the step in minutes. if not specified, uses the default timeout.
# parallelism(int): number of parallel jobs to run for this step. enables test sharding using $$BUILDKITE_PARALLEL_JOB
#     and $$BUILDKITE_PARALLEL_JOB_COUNT environment variables.
# working_dir(str): specify the place where the command should execute, default to /vllm-workspace/tests
# source_file_dependencies(list): the list of prefixes to opt-in the test for, if empty, the test will always run.

# When adding a test
# - If the test belongs to an existing group, add it there
# - If the test is short, add to any existing step
# - If the test takes more than 10min, then it is okay to create a new step.
#   Note that all steps execute in parallel.


#####################################################################################################################################
#                                                                                                                                   #
#                                                             README                                                                #
#                                                                                                                                   #
#####################################################################################################################################
#                                                                                                                                   #
# IMPORTANT:                                                                                                                        #
#   * Currently AMD CI has MI250 agents, MI300 agents, and MI355 agents. All upcoming feature improvements are                      #
#         tracked in: https://github.com/vllm-project/vllm/issues/34994                                                             #
#                                                                                                                                   #
#-----------------------------------------------------------------------------------------------------------------------------------#
#                                                                                                                                   #
# NOTES:                                                                                                                            #
#   * [Pytorch Nightly Dependency Override Check]: if this test fails, it means the nightly torch version is not compatible with    #
#                                                  some of the dependencies. Please check the error message and add the package to  #
#                                                  whitelist in `/vllm/tools/pre_commit/generate_nightly_torch_test.py`.            #
#   * [Entrypoints Integration (LLM)]:                                                                                              #
#     - {`pytest -v -s entrypoints/llm/test_generate.py`}: It needs a clean process                                                 #
#     - {`pytest -v -s entrypoints/offline_mode`}: Needs to avoid interference with other tests                                     #
#   * [Engine / Engine (1 GPU) / e2e Scheduling / e2e Core / V1 e2e / Spec Decode / V1 Sample + Logits / V1 Core + KV + Metrics]:   #
#     - Previously a single "V1 Test e2e + engine" step, now split across multiple groups.                                          #
#     - V1 e2e (2/4 GPUs) uses 4 GPUs but is scheduled on 8-GPU machines for stability. See:                                        #
#       https://github.com/vllm-project/vllm/pull/31040                                                                             #
#   * [V1 Sample + Logits / V1 Core + KV + Metrics / V1 others (CPU)]:                                                              #
#     - Previously a single "V1 others" step, now split to avoid interference.                                                      #
#     - Integration test for streaming correctness (requires special branch for __harness__ lib).                                   #
#   * [V1 others (CPU)]: Split the tests to avoid interference                                                                      #
#   * [PyTorch Compilation Unit Tests]: Run unit tests defined directly under `compile/`, not including subdirectories, which       #
#                                       are usually heavier tests covered elsewhere. Use `find` to launch multiple instances        #
#                                       of pytest so that they do not suffer from:                                                  #
#                                       https://github.com/vllm-project/vllm/issues/28965                                           #
#   * [PyTorch Fullgraph Smoke Test]: Run smoke tests under fullgraph directory, except `test_full_graph.py` as it is a heavy       #
#                                     test that is covered in other steps. Use `find` to launch multiple instances of pytest        #
#                                     so that they do not suffer from: https://github.com/vllm-project/vllm/issues/28965            #
#   * [PyTorch Fullgraph]:                                                                                                          #
#     - Limit to no custom ops to reduce running time. Wrap with quotes to escape yaml and avoid starting `-k` string               #
#       with a `-`                                                                                                                  #
#     - Old E2E tests such as:                                                                                                      #
#           ```bash                                                                                                                 #
#           pytest -v -s compile/distributed/test_fusions_e2e.py -k 'TRITON and not +quant_fp8 and not Llama-4'                     #
#           ```                                                                                                                     #
#       were removed in https://github.com/vllm-project/vllm/pull/33293 in favor of new tests in `fusions_e2e`. We                  #
#       avoid replicating the new jobs in this file as it's deprecated.                                                             #
#   * [Basic Models Tests (Extra Initialization) %N]: Only when vLLM model source is modified - test initialization of a            #
#                                                     large subset of supported models (the complement of the small subset in       #
#                                                     the above test.) Also run if model initialization test file is modified.      #
#   * [Language Models Tests (Extra Standard) %N]: Shard slow subset of standard language models tests. Only run when model         #
#                                                  source is modified, or when specified test files are modified.                   #
#   * [Language Models Tests (Hybrid) %N]: Install fast path packages for testing against transformers (mamba, conv1d).             #
#   * [Language Models Test (Extended Generation)]: Install fast path packages for testing against transformers (mamba, conv1d).    #
#   * [Multi-Modal Models (Standard) 1-4]:                                                                                          #
#     - Do NOT remove `VLLM_WORKER_MULTIPROC_METHOD=spawn` setting as ROCm requires this for certain models to function.            #
#   * [Transformers Nightly Models]: Whisper needs `VLLM_WORKER_MULTIPROC_METHOD=spawn` to avoid deadlock.                          #
#   * [Plugin Tests (2 GPUs)]:                                                                                                      #
#     - {`pytest -v -s plugins_tests/test_oot_registration_online.py`}: It needs a clean process                                    #
#     - {`pytest -v -s plugins_tests/test_oot_registration_offline.py`}: It needs a clean process                                   #
#     - {`pytest -v -s plugins_tests/lora_resolvers`}: Unit tests for in-tree lora resolver plugins                                 #
#   * [LoRA TP (Distributed)]:                                                                                                      #
#     - There is some Tensor Parallelism related processing logic in LoRA that requires multi-GPU testing for validation.           #
#     - {`pytest -v -s -x lora/test_gptoss_tp.py`}: Disabled for now because MXFP4 backend on non-cuda platform doesn't support     #
#                                                   LoRA yet.                                                                       #
#   * [Distributed Tests (NxGPUs)(HW-TAG)]: Don't test llama model here, it seems hf implementation is buggy. See:                  #
#                                           https://github.com/vllm-project/vllm/pull/5689                                          #
#   * [Distributed Tests (NxGPUs)(HW-TAG)]: Some old E2E tests were removed in https://github.com/vllm-project/vllm/pull/33293      #
#                                           in favor of new tests in fusions_e2e. We avoid replicating the new jobs in              #
#                                           this file as it's deprecated.                                                           #
#                                                                                                                                   #
#####################################################################################################################################


steps:

#-----------------------------------------------------  mi250 · models / language  -----------------------------------------------------#

- label: ":amd: (MI250) Language Models (PPL)" # TBD
  timeout_in_minutes: 65
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx90anightly, amdmi250]
  dind: false
  agent_pool: mi250_1
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/
  - tests/models/language/generation_ppl_test
  - vllm/model_executor/models/qwen3_5.py
  - vllm/model_executor/models/qwen3_5_mtp.py
  - vllm/model_executor/models/qwen2.py
  - vllm/model_executor/models/qwen3.py
  - vllm/model_executor/models/qwen3_next.py
  - vllm/model_executor/models/qwen3_next_mtp.py
  - vllm/model_executor/layers/fla/ops/
  - vllm/_aiter_ops.py
  - vllm/v1/attention/backends/triton_attn.py
  - vllm/v1/attention/backends/rocm_attn.py
  - vllm/v1/attention/backends/rocm_aiter_unified_attn.py
  - vllm/v1/attention/backends/rocm_aiter_fa.py
  - vllm/v1/attention/backends/flex_attention.py
  - vllm/v1/attention/ops/
  - vllm/platforms/rocm.py
  optional: true
  commands:
  - pytest -v -s models/language/generation_ppl_test

#----------------------------------------------------  mi250 · models / multimodal  ----------------------------------------------------#


- label: ":amd: (MI250) V1 Engine" # TBD
  timeout_in_minutes: 45
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx90anightly, amdmi250]
  dind: false
  agent_pool: mi250_1
  optional: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/v1/
  - tests/v1/engine/
  - tests/v1/test_tensor_ipc_queue.py
  - tests/config/test_mp_reducer.py
  - vllm/config/
  - vllm/engine/arg_utils.py
  - vllm/transformers_utils/config.py
  - vllm/platforms/rocm.py
  - vllm/v1/engine/
  commands:
  - pytest -v -s v1/engine/test_preprocess_error_handling.py
  - pytest -v -s v1/engine --ignore v1/engine/test_preprocess_error_handling.py
  - pytest -v -s v1/test_tensor_ipc_queue.py
  - pytest -v -s config/test_mp_reducer.py


#----------------------------------------------------------  mi300 · compile  ----------------------------------------------------------#

- label: ":amd: (MI300) PyTorch Compilation" # TBD
  timeout_in_minutes: 90
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx942nightly, amdmi300]
  dind: false
  agent_pool: mi300_1
  optional: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/compilation/
  - vllm/model_executor/layers/
  - vllm/v1/worker/
  - vllm/v1/attention/
  - vllm/v1/cudagraph_dispatcher.py
  - vllm/config/compilation.py
  - csrc/
  - tests/compile
  - vllm/platforms/rocm.py
  - vllm/__init__.py
  - vllm/_aiter_ops.py
  - vllm/_custom_ops.py
  - vllm/config/
  - vllm/distributed/
  - vllm/engine/
  - vllm/env_override.py
  - vllm/envs.py
  - vllm/forward_context.py
  - vllm/inputs/
  - vllm/ir/
  - vllm/kernels/
  - vllm/logger.py
  - vllm/model_executor/
  - vllm/multimodal/
  - vllm/platforms/
  - vllm/plugins/
  - vllm/sampling_params.py
  - vllm/sequence.py
  - vllm/transformers_utils/
  - vllm/triton_utils/
  - vllm/utils/
  - vllm/v1/
  commands:
  - "find compile/ -maxdepth 1 -name 'test_*.py' -print0 | xargs -0 -n1 -I{} pytest -s -v '{}'"
  - pytest -s -v compile/dynamic_shapes/


- label: ":amd: (MI300) V1 E2E" # TBD
  timeout_in_minutes: 30
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx942nightly, amdmi300]
  dind: false
  agent_pool: mi300_2
  num_gpus: 2
  optional: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/
  - tests/v1/e2e
  - vllm/compilation/
  - vllm/config/
  - vllm/distributed/
  - vllm/engine/
  - vllm/envs.py
  - vllm/forward_context.py
  - vllm/inputs/
  - vllm/logger.py
  - vllm/logging_utils/
  - vllm/model_executor/
  - vllm/multimodal/
  - vllm/platforms/
  - vllm/sampling_params.py
  - vllm/transformers_utils/
  - vllm/triton_utils/
  - vllm/utils/
  - vllm/v1/
  - tests/v1/e2e/spec_decode/
  commands:
    - >-
      pytest -v -s
      v1/e2e/spec_decode/draft_model/test_draft_model.py::test_draft_model_tensor_parallelism
      v1/e2e/spec_decode/draft_model/test_draft_model.py::test_draft_model_engine_args_tensor_parallelism


- label: ":amd: (MI300) Basic Correctness Sleep Mode" # TBD
  timeout_in_minutes: 60
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx942nightly, amdmi300]
  dind: false
  agent_pool: mi300_1
  fast_check: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/
  - tests/basic_correctness/
  optional: true
  commands:
  - export VLLM_WORKER_MULTIPROC_METHOD=spawn
  - pytest -v -s basic_correctness/memory/sleep_mode


- label: ":amd: (MI355) Fusion and Compile FP8"
  timeout_in_minutes: 45
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_2
  num_gpus: 2
  optional: true
  working_dir: "/vllm-workspace/"
  source_file_dependencies:
  - vllm/compilation/
  - vllm/model_executor/layers/
  - vllm/v1/attention/
  - vllm/distributed/
  - vllm/_aiter_ops.py
  - tests/compile/passes/
  - tests/compile/correctness_e2e/test_attn_quant.py
  - vllm/model_executor/kernels/linear/
  - vllm/model_executor/models/llama.py
  commands:
  - amd-smi
  - pytest -v -s tests/compile/passes/test_fusion_attn.py tests/compile/passes/test_silu_mul_quant_fusion.py tests/compile/passes/test_silu_mul_quant_manual_fusion.py
  - pytest -v -s tests/compile/correctness_e2e/test_attn_quant.py


- label: ":amd: (MI355 DPX) OpenAI API Correctness" # TBD
  timeout_in_minutes: 30
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_dpx
  optional: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - csrc/
  - vllm/entrypoints/openai/
  - vllm/model_executor/layers/
  - vllm/v1/attention/backends/
  - vllm/v1/attention/selector.py
  - vllm/_aiter_ops.py
  - vllm/platforms/rocm.py
  - vllm/model_executor/model_loader/
  commands:
  - bash ../tools/install_torchcodec_rocm.sh || exit 1
  - pytest -s entrypoints/openai/correctness/


- label: ":amd: (MI355) FLA Ops Kernels"
  timeout_in_minutes: 50
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_1
  optional: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - csrc/
  - vllm/
  - tests/kernels/
  - vllm/platforms/rocm.py
  commands:
  - pytest -v -s kernels/fla


- label: ":amd: (MI355) FusedMoE Layer Kernels" # TBD
  timeout_in_minutes: 35
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_2
  num_gpus: 2
  optional: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - csrc/moe/
  - csrc/rocm/
  - tests/kernels/moe
  - vllm/model_executor/layers/fused_moe/
  - vllm/model_executor/layers/quantization/
  - vllm/distributed/
  - vllm/config/
  - vllm/forward_context.py
  - vllm/v1/worker/workspace.py
  - vllm/utils/import_utils.py
  - vllm/utils/math_utils.py
  - vllm/utils/torch_utils.py
  - vllm/platforms/
  - vllm/_aiter_ops.py
  - csrc/quantization/w8a8/cutlass/moe/
  - vllm/distributed/device_communicators/
  - vllm/config
  commands:
  # MoRI graph cases run in the Fault Tolerance group's healthy EP baseline.
  - pytest -v -s kernels/moe/test_moe_layer.py -k "not test_moe_layer_mori_graph"


#------------------------------------------------------  mi355 · models / basic  -------------------------------------------------------#

- label: ":amd: (MI355) Basic Models (Other)" # TBD
  timeout_in_minutes: 65
  mirror_hardwares: [amdexperimental, amdproduction, amdgfx950nightly, amdmi355]
  dind: false
  agent_pool: mi355_1
  optional: true
  working_dir: "/vllm-workspace/tests"
  source_file_dependencies:
  - vllm/
  - tests/models/test_terratorch.py
  - tests/models/transformers/test_backend.py
  - tests/models/test_registry.py
  - tests/models/test_hyv4_rocm.py
  - tests/models/test_vision.py
  - tests/models/test_deepseek_v4_vl_rocm.py
  - tests/models/test_deepseek_v4_vl_stream_weights.py
  commands:
  - pytest -v -s models/test_terratorch.py models/transformers/test_backend.py models/test_registry.py models/test_deepseek_v4_vl_rocm.py models/test_deepseek_v4_vl_stream_weights.py
  - VLLM_ROCM_USE_AITER=1 pytest -v -s models/test_hyv4_rocm.py -m 'not distributed'
  - pytest -v -s models/test_vision.py::test_simple_mrope_vision_model_spatial_merge
