# Packaging metadata for the amdsmi Python bindings in TheRock's rocm-sdk-core
# (_rocm_sdk_core/share/amd_smi), which ROCm 10.1 through 10.3 ship as plain
# sources without any. docker/Dockerfile.rocm_base builds the package from those
# sources with this file, after tools/vllm-rocm/therock_wheels.py patch-amdsmi
# has fixed the loader to find libamd_smi from outside the SDK tree: the vLLM
# ROCm image installs it, the vLLM wheel pins it, and the ROCm wheel index
# serves it. An SDK that does ship its own metadata is used as-is instead.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amdsmi"
dynamic = ["version"]
description = "AMD SMI Python interface, from TheRock's rocm-sdk-core"
requires-python = ">=3.9"

[tool.setuptools.dynamic]
version = {attr = "amdsmi._version.__version__"}

# Not namespace packages: a __pycache__ directory in the sources is not a package.
[tool.setuptools.packages.find]
include = ["amdsmi*"]
namespaces = false

[tool.setuptools.package-data]
amdsmi = ["LICENSE", "README.md"]
